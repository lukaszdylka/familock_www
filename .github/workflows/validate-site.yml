name: Validate site changes

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic checks
        run: |
          git diff --check origin/main...HEAD || true
          grep -q "AW-969004050" index.html
          grep -q "G-LY7D7XH1K3" index.html
          grep -q "familock_cookie_consent_v4" index.html
          grep -q '"name": "familock"' wrangler.jsonc
