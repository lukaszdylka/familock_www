name: Show Starzik calendar directly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/show-starzik-calendar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show calendar directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          starzik_path = Path('starzik/index.html')
          s = starzik_path.read_text(encoding='utf-8')
          url = 'https://widget.lock.me/pl/calendar/fd5ace6aab33825bcc05880372c4f7b0_750_14685.html'

          s = s.replace(
              'Kalendarz LockMe otworzy się po kliknięciu. Wybierzcie dogodny termin i dokończcie rezerwację online.',
              'Kalendarz LockMe jest dostępny bezpośrednio poniżej. Wybierzcie dogodny termin i dokończcie rezerwację online.'
          )

          pattern = re.compile(r'<div class="booking-loader" id="lockme-loader">.*?</div><iframe id="booking-frame" class="booking-frame" data-src="' + re.escape(url) + r'" loading="lazy" scrolling="auto" title="Rezerwacja pokoju Starzik w Familocku" hidden></iframe>', re.S)
          replacement = f'<iframe id="booking-frame" class="booking-frame" src="{url}" loading="lazy" scrolling="auto" title="Rezerwacja pokoju Starzik w Familocku"></iframe>'
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'booking block: expected 1 match, found {count}')

          old_js = "var LOCKME='" + url + "';function loadLockme(){var f=document.getElementById('booking-frame'),l=document.getElementById('lockme-loader');if(!f)return;if(!f.getAttribute('src'))f.setAttribute('src',LOCKME);f.hidden=false;if(l)l.hidden=true}document.getElementById('load-lockme').addEventListener('click',loadLockme);document.querySelectorAll('.js-book').forEach(function(a){a.addEventListener('click',function(){setTimeout(loadLockme,180)})});"
          if old_js not in s:
              raise SystemExit('old LockMe JS not found')
          s = s.replace(old_js, '', 1)

          s = s.replace(
              'Kalendarz LockMe ładuje się dopiero po działaniu związanym z rezerwacją.',
              'Na stronie Starzika kalendarz LockMe jest osadzony bezpośrednio w sekcji rezerwacji i ładowany leniwie przez przeglądarkę.'
          )
          starzik_path.write_text(s, encoding='utf-8')

          policy_path = Path('polityka.html')
          p = policy_path.read_text(encoding='utf-8')
          p = p.replace(
              'Kalendarz LockMe nie jest uruchamiany automatycznie przy samym wejściu na stronę. Ładuje się dopiero, gdy użytkownik kliknie przycisk związany z rezerwacją albo wybierze „Pokaż dostępne terminy”. Wtedy przeglądarka łączy się z domeną LockMe, a usługa może otrzymać dane techniczne, takie jak adres IP i informacje o przeglądarce, oraz korzystać z informacji niezbędnych do procesu rezerwacji.',
              'Na stronie głównej kalendarz LockMe ładuje się po kliknięciu przycisku związanego z rezerwacją albo po wybraniu „Pokaż dostępne terminy”. Na podstronie Starzika kalendarz jest osadzony bezpośrednio w sekcji rezerwacji i ładowany leniwie, dlatego po zbliżeniu się do tej części strony przeglądarka może połączyć się z domeną LockMe. Usługa może wtedy otrzymać dane techniczne, takie jak adres IP i informacje o przeglądarce, oraz korzystać z informacji niezbędnych do procesu rezerwacji.'
          )
          p = p.replace(
              'Kalendarz LockMe ładuje się dopiero po działaniu użytkownika związanym z rezerwacją. Interaktywna mapa Google Maps jest osadzona w sekcji kontaktu i ładowana leniwie.',
              'Na stronie głównej kalendarz LockMe ładuje się po działaniu użytkownika związanym z rezerwacją, a na podstronie Starzika jest osadzony bezpośrednio w sekcji rezerwacji i ładowany leniwie. Interaktywna mapa Google Maps jest osadzona w sekcji kontaktu i ładowana leniwie.'
          )
          policy_path.write_text(p, encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          grep -q 'id="booking-frame" class="booking-frame" src="https://widget.lock.me/pl/calendar/fd5ace6aab33825bcc05880372c4f7b0_750_14685.html" loading="lazy"' starzik/index.html
          ! grep -q 'id="load-lockme"' starzik/index.html
          ! grep -q 'function loadLockme' starzik/index.html
          grep -q 'Na podstronie Starzika kalendarz jest osadzony bezpośrednio' polityka.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starzik/index.html polityka.html
          git commit -m "Pokaż kalendarz od razu na stronie Starzik"
          git push origin HEAD:main
