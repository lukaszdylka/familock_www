name: Apply Familock Cloudflare and Google Ads fix

on:
  push:
    branches:
      - agent/cloudflare-google-ads
    paths:
      - .github/workflows/apply-familock-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch files
        run: python3 .github/apply_familock_fix.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q "AW-969004050" index.html
          grep -q "familock_cookie_consent_v4" index.html
          grep -q '"name": "familock"' wrangler.jsonc

      - name: Commit patch
        run: |
          git config user.name "familock-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html polityka.html wrangler.jsonc
          git commit -m "Dodaj Google Ads i konfigurację Cloudflare"
          git push origin HEAD:agent/cloudflare-google-ads
