name: Add reservation GA4 tracking

on:
  push:
    branches:
      - agent/reservation-ga4-tracking
    paths:
      - .github/workflows/add-reservation-ga4-tracking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reservation-ga4-tracking

      - name: Add analytics events
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def inject_into_consent_script(path, marker, code):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if 'lockme_click' in s or 'reservation_view' in s:
                  raise SystemExit(f'{path}: tracking event already present')
              marker_pos = s.find(marker)
              if marker_pos < 0:
                  raise SystemExit(f'{path}: consent marker not found')
              script_start = s.rfind('<script>', 0, marker_pos)
              script_end = s.find('</script>', marker_pos)
              if script_start < 0 or script_end < 0:
                  raise SystemExit(f'{path}: consent script boundaries not found')
              block = s[script_start:script_end]
              close_pos = block.rfind('})();')
              if close_pos < 0:
                  raise SystemExit(f'{path}: IIFE close not found')
              block = block[:close_pos] + code + '\n' + block[close_pos:]
              p.write_text(s[:script_start] + block + s[script_end:], encoding='utf-8')

          index_code = r'''

  function reservationAnalyticsConsentGranted() {
    try {
      var choice = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return !!(choice && choice.version === CONSENT_VERSION && choice.analytics === true);
    } catch (e) {
      return false;
    }
  }

  function sendReservationAnalyticsEvent(eventName, params) {
    if (!reservationAnalyticsConsentGranted() || typeof window.gtag !== 'function') return false;
    var eventParams = params || {};
    eventParams.send_to = GA_MEASUREMENT_ID;
    window.gtag('event', eventName, eventParams);
    return true;
  }

  document.addEventListener('click', function(event) {
    var target = event.target;
    if (!target || !target.closest) return;
    var link = target.closest('a[href]');
    if (!link) return;
    try {
      var url = new URL(link.href, window.location.href);
      var host = url.hostname.toLowerCase();
      if (host === 'lock.me' || host.endsWith('.lock.me')) {
        sendReservationAnalyticsEvent('lockme_click', {
          room: 'starzik',
          page_path: '/',
          link_url: url.href
        });
      }
    } catch (e) {}
  }, true);
'''

          starzik_code = r'''

function reservationAnalyticsConsentGranted(){
  try{
    var choice=JSON.parse(localStorage.getItem(KEY));
    return !!(choice&&choice.version===VERSION&&choice.analytics===true);
  }catch(e){return false}
}
function sendReservationAnalyticsEvent(eventName,params){
  if(!reservationAnalyticsConsentGranted()||typeof window.gtag!=='function')return false;
  var eventParams=params||{};
  eventParams.send_to=GA;
  window.gtag('event',eventName,eventParams);
  return true;
}
document.addEventListener('click',function(event){
  var target=event.target;
  if(!target||!target.closest)return;
  var link=target.closest('a[href]');
  if(!link)return;
  try{
    var url=new URL(link.href,window.location.href);
    var host=url.hostname.toLowerCase();
    if(host==='lock.me'||host.endsWith('.lock.me')){
      sendReservationAnalyticsEvent('lockme_click',{room:'starzik',page_path:'/starzik',link_url:url.href});
    }
  }catch(e){}
},true);
var reservationViewSeen=false,reservationViewSent=false,reservationObserver=null;
function maybeSendReservationView(){
  if(!reservationViewSeen||reservationViewSent)return;
  reservationViewSent=sendReservationAnalyticsEvent('reservation_view',{room:'starzik',page_path:'/starzik'});
  if(reservationViewSent&&reservationObserver)reservationObserver.disconnect();
}
var reservationSection=document.getElementById('rezerwacja');
if(reservationSection&&'IntersectionObserver' in window){
  reservationObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting&&entry.intersectionRatio>=0.35){
        reservationViewSeen=true;
        maybeSendReservationView();
      }
    });
  },{threshold:[0.35]});
  reservationObserver.observe(reservationSection);
}
['cookie-accept-all','cookie-save'].forEach(function(id){
  var button=document.getElementById(id);
  if(button)button.addEventListener('click',function(){setTimeout(maybeSendReservationView,0)});
});
'''

          before_index = Path('index.html').read_text(encoding='utf-8')
          before_starzik = Path('starzik/index.html').read_text(encoding='utf-8')
          index_ga_count = before_index.count('G-LY7D7XH1K3')
          starzik_ga_count = before_starzik.count('G-LY7D7XH1K3')
          index_tag_count = before_index.count('googletagmanager.com/gtag/js')
          starzik_tag_count = before_starzik.count('googletagmanager.com/gtag/js')

          inject_into_consent_script('index.html', "var STORAGE_KEY = 'familock_cookie_consent_v5';", index_code)
          inject_into_consent_script('starzik/index.html', "var KEY='familock_cookie_consent_v5'", starzik_code)

          after_index = Path('index.html').read_text(encoding='utf-8')
          after_starzik = Path('starzik/index.html').read_text(encoding='utf-8')
          if after_index.count('G-LY7D7XH1K3') != index_ga_count:
              raise SystemExit('index.html: GA Measurement ID count changed')
          if after_starzik.count('G-LY7D7XH1K3') != starzik_ga_count:
              raise SystemExit('starzik/index.html: GA Measurement ID count changed')
          if after_index.count('googletagmanager.com/gtag/js') != index_tag_count:
              raise SystemExit('index.html: Google tag loader count changed')
          if after_starzik.count('googletagmanager.com/gtag/js') != starzik_tag_count:
              raise SystemExit('starzik/index.html: Google tag loader count changed')
          PY

      - name: Validate analytics-only diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html starzik/index.html "
          test "$(grep -o "reservation_view" starzik/index.html | wc -l)" -eq 1
          test "$(grep -o "reservation_view" index.html | wc -l)" -eq 0
          test "$(grep -o "lockme_click" starzik/index.html | wc -l)" -eq 1
          test "$(grep -o "lockme_click" index.html | wc -l)" -eq 1
          grep -q "document.getElementById('rezerwacja')" starzik/index.html
          grep -q "intersectionRatio>=0.35" starzik/index.html
          grep -q "page_path:'/starzik'" starzik/index.html
          grep -q "page_path: '/'" index.html
          ! grep -q "lockme_calendar_enable" index.html
          ! grep -q "lockme_calendar_enable" starzik/index.html
          ! grep -q 'id="load-lockme"' index.html
          ! grep -q 'id="load-lockme"' starzik/index.html
          test "$(grep -o 'https://widget.lock.me' index.html | wc -l)" -eq 1
          test "$(grep -o 'https://widget.lock.me' starzik/index.html | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          for path, marker, out in [
              ('index.html', "var STORAGE_KEY = 'familock_cookie_consent_v5';", '/tmp/index-ga.js'),
              ('starzik/index.html', "var KEY='familock_cookie_consent_v5'", '/tmp/starzik-ga.js')
          ]:
              s=Path(path).read_text(encoding='utf-8')
              pos=s.find(marker)
              start=s.rfind('<script>',0,pos)+len('<script>')
              end=s.find('</script>',pos)
              Path(out).write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index-ga.js
          node --check /tmp/starzik-ga.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html starzik/index.html
          git commit -m "Dodaj śledzenie rezerwacji w GA4"
          git push origin HEAD:agent/reservation-ga4-tracking
