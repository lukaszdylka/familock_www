name: Restore Google Maps on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-google-map-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'src="https://www.google.com/maps?q=Cmentarna+5%2C+41-600' index.html
          grep -q 'loading="lazy" referrerpolicy="strict-origin-when-cross-origin"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html polityka.html
          git commit -m "Przywróć osadzoną mapę Google Maps"
          git push origin HEAD:main
