name: Patch reservation GA4 tracking

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-reservation-ga4-tracking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reservation-ga4-tracking
      - name: Patch analytics
        run: |
          echo '' | base64 -d > /tmp/patch_reservation_analytics.py
          python3 /tmp/patch_reservation_analytics.py
      - name: Validate JavaScript and diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html starzik/index.html "
          node --check /tmp/index-ga.js
          node --check /tmp/starzik-ga.js
          git diff --stat
      - name: Commit to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html starzik/index.html
          git commit -m "Dodaj śledzenie rezerwacji w GA4"
          git push origin HEAD:agent/reservation-ga4-tracking
