name: Simplify Familock hero

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/simplify-hero.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Simplify hero
        run: |
          echo '' | base64 -d > /tmp/simplify_hero.py
          python3 /tmp/simplify_hero.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'font-size:clamp(4.6rem,9vw,9.5rem)' index.html
          grep -q 'font-size:clamp(1.1rem,1.8vw,1.9rem)' index.html
          grep -q 'Śląski klimat, autorskie zagadki i 90 minut gry.' index.html
          grep -q 'font-size:clamp(3.5rem,16vw,5.2rem)' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Uprość hero strony głównej"
          git push origin HEAD:main
