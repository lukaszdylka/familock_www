name: LockMe tracking patch

on:
  push:
    branches: [main]
    paths:
      - '.lockme-tracking-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/lockme_tracking_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Dodaj stronę potwierdzenia i tracking LockMe"
            git push
          fi
