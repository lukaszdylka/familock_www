name: Update hero stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-hero-stats.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update hero stats
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <div class="stat"><div class="stat-num">1</div><div class="stat-label">Scenariusz</div></div>
    <div class="stat"><div class="stat-num">1</div><div class="stat-label">Escape Box</div></div>
    <div class="stat"><div class="stat-num">2017</div><div class="stat-label">Od kiedy</div></div>'''
          new = '''    <div class="stat"><div class="stat-num">90 MIN</div><div class="stat-label">Czas gry</div></div>
    <div class="stat"><div class="stat-num">2–5</div><div class="stat-label">Graczy</div></div>
    <div class="stat"><div class="stat-num">OD 250 ZŁ</div><div class="stat-label">Za grupę</div></div>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one hero stats block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          grep -q '<div class="stat-num">90 MIN</div><div class="stat-label">Czas gry</div>' index.html
          grep -q '<div class="stat-num">2–5</div><div class="stat-label">Graczy</div>' index.html
          grep -q '<div class="stat-num">OD 250 ZŁ</div><div class="stat-label">Za grupę</div>' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Zmień statystyki w hero"
          git push origin HEAD:main
