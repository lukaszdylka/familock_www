name: Update hero stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-hero-stats.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update hero stats
        run: |
          echo '' | base64 -d > /tmp/update.py
          python3 /tmp/update.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'stat-num">90 MIN' index.html
          grep -q 'stat-num">2–5' index.html
          grep -q 'stat-num">OD 250 ZŁ' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Zmień statystyki w hero"
          git push origin HEAD:main
