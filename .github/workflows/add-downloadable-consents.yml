name: Add downloadable consent forms

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-downloadable-consents.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-downloadable-consents
      - name: Install PDF tooling
        run: python -m pip install --quiet reportlab pypdf
      - name: Generate PDFs and patch Starzik
        run: python tools/add_consents.py
      - name: Validate
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for name in ['dokumenty/zgoda-rodzica-na-gre-familock.pdf','dokumenty/zgoda-na-wizerunek-familock.pdf']:
              p=Path(name)
              assert p.exists() and p.stat().st_size > 10000, name
              assert p.read_bytes().startswith(b'%PDF-'), name
              assert len(PdfReader(str(p)).pages) == 1, name
          s=Path('starzik/index.html').read_text(encoding='utf-8')
          assert s.count('/dokumenty/zgoda-rodzica-na-gre-familock.pdf') == 2
          assert s.count('/dokumenty/zgoda-na-wizerunek-familock.pdf') == 1
          assert 'Dokumenty do pobrania' in s
          PY
      - name: Commit to feature branch
        run: |
          git rm tools/add_consents.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starzik/index.html dokumenty/zgoda-rodzica-na-gre-familock.pdf dokumenty/zgoda-na-wizerunek-familock.pdf
          git commit -m "Dodaj formularze zgód do pobrania"
          git push origin HEAD:agent/add-downloadable-consents
