name: Show homepage calendar directly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/show-home-calendar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show calendar directly
        run: |
          echo '' | base64 -d > /tmp/show_home_calendar.py
          python3 /tmp/show_home_calendar.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'booking-lockme-frame" src="https://widget.lock.me/pl/calendar/fd5ace6aab33825bcc05880372c4f7b0_750_14685.html"' index.html
          ! grep -q 'id="load-lockme"' index.html
          ! grep -q 'id="lockme-loader"' index.html
          ! grep -q 'function loadLockmeWidget' index.html
          grep -q 'Na stronie głównej oraz na podstronie Starzika kalendarz LockMe jest osadzony bezpośrednio' polityka.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html polityka.html
          git commit -m "Pokaż kalendarz LockMe bezpośrednio"
          git push origin HEAD:main
