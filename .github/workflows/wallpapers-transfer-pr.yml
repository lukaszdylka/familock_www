name: Build Familock wallpapers 4K JPG

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'wallpapers-4k-final-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallpapers-4k-final-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Create large JPG wallpapers
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          Path('img/wallpapers').mkdir(parents=True, exist_ok=True)

          def build(src, out, size):
              im = Image.open(src).convert('RGB')
              im = im.resize(size, Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.1, percent=110, threshold=3))
              im.save(out, 'JPEG', quality=95, subsampling=0, optimize=True, progressive=True)
              check = Image.open(out)
              print(f'{out}: {check.size[0]}x{check.size[1]}, {check.format}')

          build('img/wallpapers/familock-desktop.webp', 'img/wallpapers/familock-desktop-4k.jpg', (3840, 2160))
          build('img/wallpapers/familock-mobile.webp', 'img/wallpapers/familock-mobile-4k.jpg', (2160, 3840))
          PY

      - name: Commit generated files
        run: |
          rm -rf .tmp_wallpapers .wallpaper-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/wallpapers .tmp_wallpapers .wallpaper-trigger
          git commit -m "Dodaj tapety Familock 4K JPG"
          git push origin HEAD:wallpapers-4k-final-transfer
