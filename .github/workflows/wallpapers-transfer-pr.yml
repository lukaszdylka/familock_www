name: Transfer Familock wallpapers 4K

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'wallpapers-4k-final-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallpapers-4k-final-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Rebuild source images
        shell: bash
        run: |
          set -e
          {
            cat .tmp_wallpapers/desktop.00.b64
            head -c 10000 .tmp_wallpapers/desktop.01.b64
            cat .tmp_wallpapers/desktop.02.b64
            cat .tmp_wallpapers/desktop.03.b64
            cat .tmp_wallpapers/desktop.04.b64
          } | tr -cd 'A-Za-z0-9+/=' > /tmp/desktop.b64
          {
            cat .tmp_wallpapers/mobile.00.b64
            cat .tmp_wallpapers/mobile.01.b64
            cat .tmp_wallpapers/mobile.02.b64
            cat .tmp_wallpapers/mobile.03.b64
            cat .tmp_wallpapers/mobile.04.b64
            cat .tmp_wallpapers/mobile.05.b64
            cat .tmp_wallpapers/mobile.06.b64
          } | tr -cd 'A-Za-z0-9+/=' > /tmp/mobile.b64
          echo "desktop=$(wc -c < /tmp/desktop.b64) mobile=$(wc -c < /tmp/mobile.b64)"
          base64 -d /tmp/desktop.b64 > /tmp/desktop.webp
          base64 -d /tmp/mobile.b64 > /tmp/mobile.webp
          echo "400d1203c14621e332caca0e849ecb2ec87fbec80f3012eb3b28962899fe43be  /tmp/desktop.webp" | sha256sum -c -
          echo "e1133fdd4b3c49c98a739eabc9a002c891576b96ade9877b5cf684588fd8d876  /tmp/mobile.webp" | sha256sum -c -

      - name: Create 4K JPG files
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          Path('img/wallpapers').mkdir(parents=True, exist_ok=True)
          def build(src, out, size):
              im = Image.open(src).convert('RGB')
              im = im.resize(size, Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=105, threshold=3))
              im.save(out, 'JPEG', quality=95, subsampling=0, optimize=True, progressive=True)
              check = Image.open(out)
              print(out, check.size, check.format)
          build('/tmp/desktop.webp', 'img/wallpapers/familock-desktop-4k.jpg', (3840, 2160))
          build('/tmp/mobile.webp', 'img/wallpapers/familock-mobile-4k.jpg', (2160, 3840))
          PY

      - name: Commit generated wallpapers
        run: |
          rm -rf .tmp_wallpapers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/wallpapers .tmp_wallpapers
          git commit -m "Dodaj tapety Familock 4K JPG"
          git push origin HEAD:wallpapers-4k-final-transfer
