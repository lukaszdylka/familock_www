name: Wallpaper transfer diagnostic

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallpapers-4k-jpg-v2-2026-08-18
      - name: Diagnose chunks and commit report
        shell: bash
        run: |
          set +e
          mkdir -p img/wallpapers
          {
            cat .tmp_wallpapers/desktop.00.b64
            head -c 10000 .tmp_wallpapers/desktop.01.b64
            cat .tmp_wallpapers/desktop.02.b64
            cat .tmp_wallpapers/desktop.03.b64
            cat .tmp_wallpapers/desktop.04.b64
          } | tr -cd 'A-Za-z0-9+/=' > /tmp/desktop.b64
          {
            cat .tmp_wallpapers/mobile.00.b64
            cat .tmp_wallpapers/mobile.01.b64
            cat .tmp_wallpapers/mobile.02.b64
            cat .tmp_wallpapers/mobile.03.b64
            cat .tmp_wallpapers/mobile.04.b64
            cat .tmp_wallpapers/mobile.05.b64
            cat .tmp_wallpapers/mobile.06.b64
          } | tr -cd 'A-Za-z0-9+/=' > /tmp/mobile.b64
          base64 -d /tmp/desktop.b64 > /tmp/desktop.webp 2>/tmp/derr
          DRC=$?
          base64 -d /tmp/mobile.b64 > /tmp/mobile.webp 2>/tmp/merr
          MRC=$?
          {
            echo "desktop_b64=$(wc -c < /tmp/desktop.b64)"
            echo "mobile_b64=$(wc -c < /tmp/mobile.b64)"
            echo "desktop_decode_rc=$DRC"
            echo "mobile_decode_rc=$MRC"
            echo "desktop_bytes=$(wc -c < /tmp/desktop.webp)"
            echo "mobile_bytes=$(wc -c < /tmp/mobile.webp)"
            sha256sum /tmp/desktop.webp /tmp/mobile.webp
            echo "desktop_error=$(cat /tmp/derr)"
            echo "mobile_error=$(cat /tmp/merr)"
          } > img/wallpapers/debug-wallpapers.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/wallpapers/debug-wallpapers.txt
          git commit -m "Diagnozuj transfer tapet"
          git push origin HEAD:wallpapers-4k-jpg-v2-2026-08-18
