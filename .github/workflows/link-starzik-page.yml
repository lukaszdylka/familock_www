name: Link Starzik page from homepage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-starzik-page.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Starzik details link
        run: |
          echo '' | base64 -d > /tmp/link_starzik.py
          python3 /tmp/link_starzik.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'href="/starzik/" class="btn-book">Więcej o pokoju' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Podepnij stronę Starzik z homepage"
          git push origin HEAD:main
