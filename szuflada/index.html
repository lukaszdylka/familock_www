<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0908"><title>Tajna szuflada Starzika | Familock</title><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--rose:#d39ba4}*{box-sizing:border-box}body{margin:0;background:#0a0808;color:#eee;font-family:Barlow,Arial,sans-serif}.mast{display:flex;align-items:center;justify-content:space-between;padding:15px clamp(16px,5vw,65px);border-bottom:1px solid #ffffff20}.brand{color:#f5e6dc;text-decoration:none;font:800 27px 'Barlow Condensed',sans-serif}.brand em{font-style:normal;color:var(--rose)}.mast small{letter-spacing:.18em;font-size:10px;color:#bba8a0}.intro{text-align:center;padding:15px 15px 16px}.intro small{letter-spacing:.25em;color:var(--rose);font-size:10px}.intro h1{font:800 clamp(32px,5vw,58px) 'Barlow Condensed',sans-serif;margin:5px 0 8px;text-transform:uppercase}.intro p{margin:0;color:#b9a7a0;font-size:13px}.scene-wrap{width:min(1350px,96vw);margin:auto;overflow-x:auto;scrollbar-color:#6d4747 #160f0f}.scene{position:relative;width:100%;min-width:780px;aspect-ratio:1672/381;isolation:isolate;overflow:hidden;background:#170e0b;box-shadow:0 20px 80px #000}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.photo.open-state{opacity:0;transition:opacity .7s ease}.scene.is-open .photo.open-state{opacity:1}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#07030370,transparent 14%,transparent 86%,#07030370);z-index:3}.closed-front{position:absolute;left:34.6%;top:57%;width:30.9%;height:43%;z-index:2;transform:translateY(0);transform-origin:top center;transition:transform .7s ease,opacity .55s ease;background:repeating-linear-gradient(1deg,#472211 0px,#542c17 4px,#2d140c 9px,#62371d 13px,#3c2011 20px);border:8px solid #281309;border-top:13px solid #170b08;box-shadow:inset 0 0 25px #130704,0 4px 17px #000c}.closed-front:before{content:'';position:absolute;left:45%;top:55%;width:10%;height:12%;border:3px solid #b38a4d;border-radius:0 0 55% 55%;box-shadow:0 1px 3px #000;background:#342010}.closed-front:after{content:'';position:absolute;left:49%;top:37%;width:2%;height:11%;border:2px solid #8e6838;border-radius:50%;background:#1b0b05}.scene.is-open .closed-front{transform:translateY(100%);opacity:0}.hit{position:absolute;z-index:5;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:#fff}.hit:hover,.hit:focus-visible{outline:none;background:#ffffff12;border-color:#e5b4aa80}.hit:after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#efd5c2;box-shadow:0 0 0 5px #15080888,0 0 15px #ffc7aa;transform:translate(-50%,-50%)}.hit span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;padding:7px 10px;background:#140c0cec;border:1px solid #ffffff29;white-space:nowrap;opacity:0}.hit:hover span,.hit:focus-visible span{opacity:1}.radio{left:18.5%;top:3%;width:19%;height:47%}.clock{left:42.2%;top:3%;width:16.5%;height:39%}.machine{left:63%;top:1%;width:19.5%;height:53%}.drawer{left:35%;top:58%;width:30%;height:40%}.below{max-width:1500px;margin:auto;display:flex;justify-content:space-between;gap:15px;padding:16px 20px;color:#a99a92;font-size:12px}.below button{color:#e8a9b3;background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit}.veil{position:fixed;inset:0;z-index:20;background:#050404ee;display:grid;place-items:center;padding:16px}.veil[hidden]{display:none}.panel{position:relative;width:min(640px,100%);max-height:90vh;overflow:auto;padding:clamp(20px,5vw,40px);background:#17110f;border:1px solid #644549;box-shadow:0 20px 70px #000}.panel h2{font:800 40px 'Barlow Condensed',sans-serif;margin:0 0 10px}.panel p{color:#d0bdb4;line-height:1.6}.exit{position:absolute;top:7px;right:13px;background:none;border:0;color:#eee;font-size:32px;cursor:pointer}.field{width:100%;padding:12px;background:#090807;border:1px solid #725659;color:#fff;font:inherit}.action{margin-top:12px;padding:10px 18px;background:#6b3440;border:1px solid #ac7780;color:#fff;cursor:pointer}.readout{text-align:center;font:34px Georgia,serif;padding:12px;color:#e9d0b3}.stepper{display:flex;justify-content:center;gap:14px}.stepper button{background:#30221f;border:1px solid #755653;color:#fff;padding:9px 20px;cursor:pointer}.status{font-size:12px;color:#d9a8b0}input[type=range]{width:100%;accent-color:var(--rose)}@media(max-width:800px){.scene-wrap{scroll-snap-type:x proximity}.scene{scroll-snap-align:start}.intro{padding:18px 12px}.mast small{font-size:8px}.below{font-size:11px}}@media(prefers-reduced-motion:reduce){.photo.open-state{transition:none}}
</style></head><body><header class="mast"><a class="brand" href="/">FAMI<em>LOCK</em></a><small>STARZIK · PAMIĄTKA PO GRZE</small></header><section class="intro"><small>JESZCZE JEDNA HISTORIA</small><h1>Tajna szuflada Starzika</h1><p>Dotknij radia, zegara lub maszyny. Otwórz środkową szufladę.</p></section><main><div class="scene-wrap" aria-label="Interaktywne biurko, na małym ekranie przesuń w bok"><div class="scene" id="scene"><img class="photo" src="assets/starzik-closed.webp" alt="Biurko Starzika z zamkniętą szufladą"><img class="photo open-state" src="assets/starzik-open.webp" alt="" aria-hidden="true"><button class="hit radio" data-item="radio" aria-label="Radio"><span>Radio</span></button><button class="hit clock" data-item="clock" aria-label="Zegar"><span>Zegar</span></button><button class="hit machine" data-item="machine" aria-label="Maszyna do pisania"><span>Maszyna do pisania</span></button><button class="hit drawer" id="drawer" data-item="drawer" aria-label="Otwórz szufladę" aria-expanded="false"><span>Szuflada</span></button></div></div><div class="below"><span>Na telefonie przesuń scenę w bok, aby zobaczyć wszystkie przedmioty.</span><button id="toggle">Otwórz szufladę</button></div></main><div class="veil" id="veil" hidden role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel"><button class="exit" id="exit" aria-label="Zamknij">×</button><h2 id="title"></h2><div id="content"></div></div></div><script>
(()=>{const scene=document.getElementById('scene'),drawer=document.getElementById('drawer'),toggle=document.getElementById('toggle'),veil=document.getElementById('veil'),title=document.getElementById('title'),content=document.getElementById('content');let opened=false,hour=12;function flip(){opened=!opened;scene.classList.toggle('is-open',opened);const label=opened?'Zamknij szufladę':'Otwórz szufladę';toggle.textContent=label;drawer.setAttribute('aria-label',label);drawer.setAttribute('aria-expanded',String(opened))}toggle.onclick=flip;function show(t,html){title.textContent=t;content.innerHTML=html;veil.hidden=false;document.getElementById('exit').focus()}function close(){veil.hidden=true}document.getElementById('exit').onclick=close;veil.onclick=e=>{if(e.target===veil)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{const a=el.dataset.item;if(a==='drawer'){flip();return}if(a==='machine'){show('Maszyna do pisania','<p>Stara maszyna Remington. Wpisz hasło, aby odczytać wiadomość.</p><form id="form"><input class="field" id="password" aria-label="Hasło" placeholder="Wpisz hasło" autocomplete="off"><button class="action">Sprawdź</button></form><p class="status" id="result"></p>');document.getElementById('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Zagadka jest jeszcze w przygotowaniu.'}}if(a==='clock'){show('Zegar','<p>Ustaw godzinę na starym zegarze.</p><div class="readout" id="time">12:00</div><div class="stepper"><button id="minus">−</button><button id="plus">+</button></div><p class="status">Mechanizm demonstracyjny. Godzina zagadki zostanie ustalona później.</p>');hour=12;const paint=()=>document.getElementById('time').textContent=String(hour).padStart(2,'0')+':00';document.getElementById('minus').onclick=()=>{hour=(hour+23)%24;paint()};document.getElementById('plus').onclick=()=>{hour=(hour+1)%24;paint()}}if(a==='radio'){show('Radio','<p>Przesuń pokrętło i dostrój częstotliwość.</p><div class="readout" id="freq">90.0 MHz</div><input type="range" id="tuner" min="87.5" max="108" step=".1" value="90" aria-label="Częstotliwość"><p class="status">Mechanizm demonstracyjny. Właściwa częstotliwość zostanie dodana później.</p>');document.getElementById('tuner').oninput=e=>document.getElementById('freq').textContent=Number(e.target.value).toFixed(1)+' MHz'}})})();
</script></body></html>
