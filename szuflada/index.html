<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;900&amp;display=swap"><meta name="theme-color" content="#11100e"><meta name="description" content="Tajna szuflada Starzika. Pamiątka po wizycie w Familock Escape Room."><title>Tajna szuflada Starzika | Familock</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee9e5;font-family:Barlow,Arial,sans-serif}.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,70px);border-bottom:1px solid #ffffff20}.logo{font:900 26px "Barlow Condensed",Arial;color:#fff;letter-spacing:.02em;text-decoration:none}.logo em{font-style:normal;color:#df8b97}.top small{font-size:10px;letter-spacing:.18em;color:#aaa;display:block}.head{text-align:center;padding:35px 15px 22px}.head small{color:#d5a0a7;letter-spacing:.3em;font-size:10px}.head h1{font:700 clamp(31px,5vw,62px) "Barlow Condensed",Arial;text-transform:uppercase;margin:10px 0 8px}.head p{color:#aaa;line-height:1.5;font-size:14px}.frame{width:min(1180px,96vw);margin:auto;position:relative;overflow:hidden;border:1px solid #4b3938;background:#140f0c;box-shadow:0 18px 80px #000;aspect-ratio:2048/1151}.frame img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:opacity .7s ease,transform 1s ease;filter:sepia(.1)}#open{opacity:0;transform:scale(1.015)}.frame.open #open{opacity:1;transform:scale(1)}.frame.open #closed{opacity:0}.frame:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px #0009}.spot{position:absolute;z-index:2;background:transparent;border:1px solid transparent;cursor:pointer;border-radius:12px;color:#fff}.spot:hover,.spot:focus-visible{border-color:#f2d3c085;background:#ffffff16;outline:0}.spot span{opacity:0;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;background:#120e0de8;padding:7px 11px;border:1px solid #63534d;font-size:12px}.spot:hover span,.spot:focus-visible span{opacity:1}.spot:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#e9b6b8;box-shadow:0 0 0 5px #100b0b88,0 0 16px #f1acb8;transform:translate(-50%,-50%)}.lamp{left:3%;top:5%;width:24%;height:35%}.clock{left:37%;top:25%;width:21%;height:21%}.machine{left:56%;top:24%;width:23%;height:39%}.drawer{left:18%;top:73%;width:30%;height:24%}.frame:not(.open) .drawer{left:16%;top:74%;width:63%;height:19%}.under{width:min(1180px,96vw);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 3px;color:#aaa;font-size:13px}.link{background:transparent;border:0;color:#df9ba4;text-decoration:underline;cursor:pointer;padding:10px}.modal{position:fixed;inset:0;background:#030303df;z-index:5;display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.panel{width:min(520px,100%);background:#171313;border:1px solid #6a4548;padding:clamp(22px,4vw,40px);position:relative;box-shadow:0 20px 80px #000}.panel h2{font-size:28px;margin:0 0 15px}.panel p{line-height:1.7;color:#c8bcbc}.x{position:absolute;right:15px;top:8px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}.field{background:#0a0909;border:1px solid #72575b;color:white;width:100%;padding:14px;font-size:18px}.go{background:#762d39;color:white;border:1px solid #a15d68;padding:12px 20px;margin-top:13px;cursor:pointer}.note{color:#c5a4a8;font-size:13px;margin-top:15px}@media(max-width:650px){.frame{width:100%;aspect-ratio:4/5}.frame img{object-fit:contain;object-position:center}.under{width:100%;padding:10px 16px}.spot:after{width:6px;height:6px}.clock{left:35%;top:30%;width:22%;height:18%}.machine{left:58%;top:26%;width:36%;height:33%}.drawer{left:12%;top:68%;width:45%;height:30%}.frame:not(.open) .drawer{left:9%;top:75%;width:80%;height:21%}}@media(prefers-reduced-motion:reduce){.frame img{transition:none}}
</style></head><body><header class="top"><a class="logo" href="https://familock.pl">FAMI<em>LOCK</em><small>ESCAPE ROOM · ŚWIĘTOCHŁOWICE</small></a><span style="font-size:12px;color:#aaa">STARZIK</span></header><section class="head"><small>PO GRZE HISTORIA TRWA DALEJ</small><h1>Tajna szuflada Starzika</h1><p>Witej nazod. Dotknij biurka. Może Starzik zostawił tu coś jeszcze...</p></section><main><div class="frame" id="frame"><img id="closed" src="assets/biurko.webp" alt="Biurko Starzika z zamkniętą szufladą"><img id="open" src="assets/szuflada.webp" alt="Biurko Starzika z otwartą szufladą"><button class="spot lamp" aria-label="Lampka" data-item="lamp"><span>Lampka</span></button><button class="spot clock" aria-label="Zegar" data-item="clock"><span>Zegar</span></button><button class="spot machine" aria-label="Maszyna do pisania" data-item="machine"><span>Maszyna</span></button><button class="spot drawer" aria-label="Otwórz szufladę" data-item="drawer" id="drawer"><span>Szuflada</span></button></div><div class="under"><span>Dotknij przedmiotów, aby je zbadać.</span><button class="link" id="toggle">Otwórz szufladę</button></div></main><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt"><div class="panel"><button class="x" id="x" aria-label="Zamknij">×</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const frame=document.querySelector('#frame'),toggle=document.querySelector('#toggle'),drawer=document.querySelector('#drawer'),modal=document.querySelector('#modal'),mt=document.querySelector('#mt'),mb=document.querySelector('#mb');let open=false;function flip(){open=!open;frame.classList.toggle('open',open);toggle.textContent=open?'Zamknij szufladę':'Otwórz szufladę';drawer.setAttribute('aria-label',toggle.textContent);drawer.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-expanded',String(open))}toggle.onclick=flip;function show(t,h){mt.textContent=t;mb.innerHTML=h;modal.hidden=false;document.querySelector('#x').focus()}function close(){modal.hidden=true}document.querySelector('#x').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};document.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{const item=b.dataset.item;if(item==='drawer'){flip();return}if(item==='machine')show('Maszyna do pisania','<p>Wpisz hasło. Na razie to demonstracja interakcji, bez ustalonego rozwiązania.</p><input class="field" id="answer" placeholder="Hasło" autocomplete="off"><button class="go" id="check">Sprawdź</button><div class="note" id="status"></div>');if(item==='clock')show('Zegar','<p>Ustaw godzinę na zegarze.</p><input class="field" type="time" id="answer" value="12:00"><button class="go" id="check">Ustaw</button><div class="note" id="status"></div>');if(item==='lamp')show('Lampka','<p>Światło odsłania kolejne ślady. Ten element rozbudujemy o animację oświetlenia.</p>');const c=document.querySelector('#check');if(c)c.onclick=()=>document.querySelector('#status').textContent='Mechanika gotowa do podłączenia właściwego rozwiązania.'});
</script></body></html>
