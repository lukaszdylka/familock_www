<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;900&amp;display=swap"><meta name="theme-color" content="#11100e"><meta name="description" content="Tajna szuflada Starzika. Pamiątka po wizycie w Familock Escape Room."><title>Tajna szuflada Starzika | Familock</title><style>
:root{color-scheme:dark;--bg:#100f0e;--fg:#e6ded2;--muted:#a8a095;--line:#61574a;--accent:#c5ae8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100svh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:19px clamp(18px,4vw,64px);border-bottom:1px solid #ffffff19;gap:16px}.brand{letter-spacing:.22em;font-size:17px;text-decoration:none;color:var(--fg)}.brand small{display:block;letter-spacing:.2em;color:var(--muted);font-size:9px;margin-top:6px}.sound,.back{background:transparent;color:var(--fg);border:1px solid #ffffff3a;padding:10px 13px}.intro{text-align:center;padding:clamp(23px,4vw,48px) 20px 22px}.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(31px,5vw,64px);margin:12px 0}.intro p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto;max-width:620px}.scene-wrap{width:min(1320px,96vw);margin:8px auto 0;position:relative}.scene{position:relative;overflow:hidden;background:#201912;border:1px solid #514737;box-shadow:0 25px 90px #0009;aspect-ratio:2048/1151}.scene img{width:100%;height:100%;display:block;object-fit:cover;filter:brightness(.9) saturate(.92);transition:filter .5s,opacity .4s}.scene.lit img{filter:brightness(1.05) saturate(1)}.scene:after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 75px 12px #08070666}.hotspot{position:absolute;border:1px solid transparent;background:transparent;border-radius:10px;color:white;z-index:2;transition:background .2s,border-color .2s}.hotspot:hover,.hotspot:focus-visible{background:#e5c9a01c;border-color:#e5c9a0a6;outline:0}.hotspot:after{content:"";display:block;width:7px;height:7px;border-radius:50%;background:#dfc29a;box-shadow:0 0 0 5px #0c090980,0 0 16px 5px #d5ae70;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.hotspot span{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;white-space:nowrap;background:#0b0a09dd;padding:6px 9px;opacity:0;transition:opacity .2s}.hotspot:hover span,.hotspot:focus-visible span{opacity:1}.lamp{left:19%;top:23%;width:22%;height:34%}.clock{left:50%;top:49%;width:19%;height:19%}.typewriter{left:69%;top:47%;width:23%;height:37%}.drawer{left:21%;top:77%;width:55%;height:20%}.open .lamp{left:2%;top:1%;width:28%;height:25%}.open .clock{left:39%;top:16%;width:21%;height:19%}.open .typewriter{left:55%;top:13%;width:24%;height:35%}.open .drawer{left:19%;top:58%;width:25%;height:39%}.scene-caption{display:flex;justify-content:space-between;gap:14px;align-items:center;color:var(--muted);font-size:12px;padding:16px 2px;flex-wrap:wrap}.plain{background:transparent;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px}.foot{margin-top:auto;text-align:center;padding:25px 12px;color:#837a70;font-size:11px;letter-spacing:.07em}.modal{position:fixed;inset:0;z-index:10;background:#050505e8;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.panel{position:relative;width:min(620px,100%);max-height:90svh;overflow:auto;background:linear-gradient(135deg,#24201b,#12110f);border:1px solid #685944;box-shadow:0 24px 90px #000;padding:clamp(24px,5vw,44px)}.close{position:absolute;right:15px;top:12px;background:transparent;color:var(--fg);border:0;font-size:28px}.panel h2{font:normal clamp(26px,4vw,40px) Georgia,serif;margin:10px 0 22px}.panel p{line-height:1.8;color:#c9c0b4;font-size:15px}.paper{background:#d4c1a0;color:#34271b;padding:clamp(18px,4vw,34px);transform:rotate(-.5deg);box-shadow:3px 8px 20px #0008}.paper p{color:#34271b;font:italic 18px/1.7 Georgia,serif}.btn{border:1px solid #a38a66;background:#ad9470;color:#14110d;padding:12px 20px;margin-top:15px}.btn.secondary{background:transparent;color:var(--fg)}.type-line{font:20px/1.7 'Courier New',monospace;color:#dfd3c2;min-height:100px;white-space:pre-wrap}.field{display:block;background:#0e0d0c;border:1px solid #786950;color:var(--fg);padding:13px;width:100%;margin-top:12px}.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.key{border:1px solid #76634c;background:#211b15;color:#e6d6bd;padding:12px 16px;min-width:45px}.key.selected{background:#b39b76;color:#17120d}.status{color:#bfb19b;font-size:13px;margin-top:12px}.reveal{border:1px solid #796c57;padding:18px;margin-top:20px;background:#2c251c}.hidden{display:none!important}@media(max-width:680px){.scene-wrap{width:100%}.scene{aspect-ratio:4/5}.scene img{object-fit:cover;object-position:center}.scene:not(.open) img{object-position:63% center}.hotspot:after{width:6px;height:6px}.lamp{left:3%;top:24%;width:33%;height:26%}.clock{left:38%;top:48%;width:28%;height:18%}.typewriter{left:64%;top:42%;width:34%;height:39%}.drawer{left:12%;top:80%;width:76%;height:18%}.open .lamp{left:2%;top:7%;width:28%;height:24%}.open .clock{left:35%;top:17%;width:26%;height:18%}.open .typewriter{left:58%;top:17%;width:38%;height:32%}.open .drawer{left:6%;top:57%;width:44%;height:38%}.scene-caption{padding:14px}.intro{padding-top:23px}.panel{padding:26px 20px}}

:root{--bg:#0d0d0d;--fg:#f0ecec;--muted:#b0a8a5;--line:#353030;--accent:#eb8b96;--red:#8b2530;--heading:"Barlow Condensed",Arial,sans-serif}
body{font-family:Barlow,Arial,sans-serif}
.brand{font-family:var(--heading);font-size:1.65rem;font-weight:900;letter-spacing:.04em}
.brand span{color:var(--accent)}
.brand small,.eyebrow,.sound{font-family:var(--heading)}
h1,.panel h2{font-family:var(--heading);font-weight:700}
h1{font-size:clamp(2.25rem,6vw,4.5rem);line-height:1}
.btn{background:var(--red);border-color:#b34956;color:#fff}
.scene-wrap{width:min(1100px,96vw)}
.scene,.scene:not(.open){aspect-ratio:2048/1151}
.scene img,.scene:not(.open) img{object-fit:contain;object-position:center}
.scene:after{box-shadow:inset 0 0 45px 6px #08070655}
.hotspot:after{background:#fff0e7;box-shadow:0 0 0 5px #241316a0,0 0 12px 3px #bc697d}
.hotspot span{z-index:2}
.drawer span,.open .drawer span{top:auto;bottom:calc(100% + 3px)}
.lamp{left:19%;top:27%;width:21%;height:32%}
.clock{left:47%;top:62%;width:15%;height:16%}
.typewriter{left:62.5%;top:62%;width:19%;height:23%}
.drawer{left:17%;top:86%;width:73%;height:14%}
.open .lamp{left:4%;top:2%;width:25%;height:29%}
.open .clock{left:39.5%;top:21%;width:16%;height:19%}
.open .typewriter{left:56%;top:21%;width:18%;height:32%}
.open .drawer{left:21%;top:75%;width:23%;height:25%}

button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media(prefers-reduced-motion:reduce){.scene img,.hotspot,.hotspot span{transition:none}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="https://familock.pl/">FAMI<span>LOCK</span><small>ESCAPE ROOM · ŚWIĘTOCHŁOWICE</small></a><button class="sound" id="sound" aria-pressed="false">Dźwięk: wył.</button></header><section class="intro"><div class="eyebrow">Pamiątka po grze · Starzik</div><h1>Tajna szuflada Starzika</h1><p>Myśloł żeś, że wszystko już widzioł? Rozejrzyj się po biurku. Niektóre rzeczy mają jeszcze swoją historię.</p></section><main class="scene-wrap"><div class="scene lit" id="scene"><img id="photo" src="assets/biurko.webp" alt="Prawdziwe biurko z pokoju Starzik: lampka, zegar i maszyna do pisania"><button class="hotspot lamp" data-action="lamp" aria-label="Włącz lub wyłącz lampkę"><span>Lampka</span></button><button class="hotspot clock" data-action="clock" aria-label="Zbadaj zegar"><span>Zegar</span></button><button class="hotspot typewriter" data-action="typewriter" aria-label="Zbadaj maszynę do pisania"><span>Maszyna do pisania</span></button><button class="hotspot drawer" data-action="drawer" aria-label="Otwórz szufladę" aria-expanded="false"><span>Szuflada</span></button></div><div class="scene-caption"><span>Dotknij przedmiotów na fotografii, aby je zbadać.</span><button class="plain" id="drawerToggle" aria-expanded="false">Otwórz szufladę</button></div></main><footer class="foot">FAMILOCK · STARZIK</footer></div><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel"><button class="close" id="close" aria-label="Zamknij">×</button><div class="eyebrow" id="modalEyebrow">Archiwum Starzika</div><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script>
(()=>{'use strict';const scene=document.getElementById('scene'),photo=document.getElementById('photo'),modal=document.getElementById('modal'),body=document.getElementById('modalBody'),title=document.getElementById('modalTitle'),eyebrow=document.getElementById('modalEyebrow');let opened=false,lit=true,sound=false,clockClicks=0,typed=false;const done=()=>localStorage.setItem('familock-starzik-odkryte','1');function beep(freq=550,dur=.05){if(!sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='triangle';g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);o.onended=()=>c.close()}catch(e){}}function show(t,html,sub='Archiwum Starzika'){title.textContent=t;eyebrow.textContent=sub;body.innerHTML=html;modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}function hide(){modal.hidden=true;document.body.style.overflow=''}document.getElementById('close').onclick=hide;modal.addEventListener('click',e=>{if(e.target===modal)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='Dźwięk: '+(sound?'wł.':'wył.');e.currentTarget.setAttribute('aria-pressed',sound);beep()};const drawerPhoto = new Image();
drawerPhoto.src = 'assets/szuflada.webp';
const drawerButton = document.querySelector('[data-action="drawer"]');
const drawerToggle = document.getElementById('drawerToggle');
drawerToggle.onclick = drawer;

function drawer() {
  opened = !opened;
  scene.classList.toggle('open', opened);
  photo.src = opened ? 'assets/szuflada.webp' : 'assets/biurko.webp';
  photo.alt = opened ? 'Biurko Starzika z otwartą szufladą i dokumentami' : 'Biurko Starzika z lampką, zegarem i maszyną do pisania';
  const label = opened ? 'Zamknij szufladę' : 'Otwórz szufladę';
  drawerButton.setAttribute('aria-label', label);
  drawerButton.setAttribute('aria-expanded', String(opened));
  drawerToggle.textContent = label;
  drawerToggle.setAttribute('aria-expanded', String(opened));
  beep(250, .14);
}
function typewriter(){show('Maszyna do pisania','<p>Na wałku maszyny czeka czysta kartka. Naciśnij przycisk, żeby odczytać pozostawioną wiadomość.</p><div class="type-line" id="typedText"></div><button class="btn" id="typeStart">Napisz wiadomość</button>','List bez adresata');document.getElementById('typeStart').onclick=()=>{const txt='Witej nazod.\n\nJeśli to czytosz, znaczy, żeś wrócił do mojego biurka.\n\nNie wszystkie historie kończą się po zamknięciu drzwi.\n\nStarzik';const el=document.getElementById('typedText');el.textContent='';let i=0;const btn=document.getElementById('typeStart');btn.disabled=true;const timer=setInterval(()=>{if(modal.hidden){clearInterval(timer);return}el.textContent+=txt[i++]||'';if(i%3===0)beep(330+Math.random()*90,.025);if(i>=txt.length){clearInterval(timer);done()}},35)}}function clock(){clockClicks=0;show('Stary zegar','<p>Wskazówki zatrzymały się. Może to tylko przypadek, a może godzina ma znaczenie?</p><div class="keys"><button class="key" id="clockPrev">−</button><span id="clockTime" style="font:32px Georgia,serif;min-width:120px;text-align:center">12:00</span><button class="key" id="clockNext">+</button></div><p class="status">Przestaw wskazówki o godzinę w przód lub w tył.</p>','Przedmiot z biurka');let hour=12;const set=()=>document.getElementById('clockTime').textContent=String(hour).padStart(2,'0')+':00';document.getElementById('clockPrev').onclick=()=>{hour=(hour+23)%24;set();beep(480)};document.getElementById('clockNext').onclick=()=>{hour=(hour+1)%24;set();beep(480)}}document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='lamp'){lit=!lit;scene.classList.toggle('lit',lit);beep(220)}if(a==='drawer')drawer();if(a==='typewriter')typewriter();if(a==='clock')clock()})})();
</script></body></html>
