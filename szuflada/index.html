<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d0b0b"><title>Tajna szuflada Starzika | Familock</title><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--accent:#cb8995;--paper:#e9d6b7}*{box-sizing:border-box}body{margin:0;background:#0c0a09;color:#eee;font-family:Barlow,Arial,sans-serif}.mast{height:64px;padding:0 clamp(18px,4vw,65px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff17}.logo{font:800 27px 'Barlow Condensed',sans-serif;color:#fff;text-decoration:none;letter-spacing:.02em}.logo em{font-style:normal;color:var(--accent)}.mast small{font-size:10px;letter-spacing:.19em;color:#b9a7a4}.intro{text-align:center;padding:26px 15px 20px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.27em}.intro h1{font:800 clamp(34px,5vw,64px) 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.015em;margin:5px 0}.intro p{color:#c1b4ae;margin:0;font-size:14px}.scene{position:relative;width:min(1400px,100%);margin:auto;aspect-ratio: 1024 / 768;overflow:hidden;background:#1a100c;box-shadow:0 20px 85px #000b;isolation:isolate}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none;filter:brightness(.88) contrast(1.04)}.scene .opened{opacity:0;transition:opacity .65s ease}.scene.is-open .opened{opacity:1}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 44%,#0b070760 100%);z-index:2}.hotspot{position:absolute;z-index:4;border:1px solid transparent;background:transparent;border-radius:14px;cursor:pointer;color:#fff;touch-action:manipulation}.hotspot:hover,.hotspot:focus-visible{border-color:#eed0c380;background:#fff1;outline:none}.hotspot:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#e9b9a9;box-shadow:0 0 0 5px #170b0b91,0 0 15px #e9b9a9;transform:translate(-50%,-50%);opacity:.85}.hotspot span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#130e0edb;padding:7px 10px;border:1px solid #ffffff26;border-radius:5px;font:12px Barlow,Arial,sans-serif;opacity:0;pointer-events:none}.hotspot:hover span,.hotspot:focus-visible span{opacity:1}.radio{left:5%;top:10%;width:30%;height:34%}.clock{left:37%;top:12%;width:23%;height:29%}.typewriter{left:61%;top:15%;width:34%;height:39%}.drawer{left:26%;top:57%;width:49%;height:37%}.scene.is-open .drawer{top:61%;height:35%}.below{width:min(1400px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;color:#a99d96;font-size:13px}.below button{background:none;border:0;color:#e5a4ae;text-decoration:underline;cursor:pointer;font:inherit}.veil{position:fixed;inset:0;z-index:20;background:#050404eb;display:grid;place-items:center;padding:18px}.veil[hidden]{display:none}.panel{width:min(640px,100%);max-height:90vh;overflow:auto;position:relative;padding:clamp(22px,5vw,40px);background:#181311;border:1px solid #715154;box-shadow:0 20px 70px #000}.panel h2{font:800 40px 'Barlow Condensed',sans-serif;margin:0 0 10px}.panel p{color:#cdbeb5;line-height:1.65}.close{position:absolute;top:7px;right:13px;background:none;border:0;color:#eee;font-size:32px;cursor:pointer}.field{width:100%;padding:13px;background:#0b0908;border:1px solid #72575a;color:#fff;font:inherit;margin:8px 0}.action{padding:12px 22px;border:1px solid #b47782;background:#69303b;color:#fff;font:inherit;cursor:pointer}.readout{font:36px Georgia,serif;text-align:center;margin:20px 0;color:var(--paper)}.stepper{display:flex;justify-content:center;gap:16px}.stepper button{background:#2c2422;color:#fff;border:1px solid #765a57;padding:10px 25px;cursor:pointer}.status{color:#e1b3b5;font-size:13px}.freq{display:block;text-align:center;font:30px Georgia,serif;color:var(--paper);margin:15px 0}input[type=range]{width:100%;accent-color:var(--accent)}@media(max-width:650px){.mast{height:58px}.mast small{font-size:8px}.intro{padding:20px 12px}.intro p{font-size:12px}.scene{aspect-ratio:1024/768}.hotspot:after{width:5px;height:5px}.below{font-size:11px;padding:14px}.panel h2{font-size:34px}}@media(prefers-reduced-motion:reduce){.scene .opened{transition:none}}
</style></head><body><header class="mast"><a href="/" class="logo">FAMI<em>LOCK</em></a><small>STARZIK · PAMIĄTKA PO GRZE</small></header><section class="intro"><div class="eyebrow">JESZCZE JEDNA HISTORIA</div><h1>Tajna szuflada Starzika</h1><p>Rozejrzyj się po biurku. Dotknij przedmiotów i zajrzyj do szuflady.</p></section><main><div class="scene" id="scene"><img src="assets/biurko-zamkniete.webp" alt="Biurko Starzika z zamkniętą szufladą" draggable="false"><img class="opened" src="assets/biurko-otwarte.webp" alt="" aria-hidden="true" draggable="false"><button class="hotspot radio" data-item="radio" aria-label="Radio"><span>Radio</span></button><button class="hotspot clock" data-item="clock" aria-label="Zegar"><span>Zegar</span></button><button class="hotspot typewriter" data-item="typewriter" aria-label="Maszyna do pisania"><span>Maszyna do pisania</span></button><button class="hotspot drawer" data-item="drawer" id="drawer" aria-label="Otwórz szufladę" aria-expanded="false"><span>Szuflada</span></button></div><div class="below"><span>Wybierz przedmiot na biurku</span><button id="toggle" type="button">Otwórz szufladę</button></div></main><div class="veil" id="veil" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="panel"><button class="close" id="close" aria-label="Zamknij">×</button><h2 id="dialogTitle"></h2><div id="dialogContent"></div></div></div><script>
(()=>{const scene=document.getElementById('scene'),drawer=document.getElementById('drawer'),toggle=document.getElementById('toggle'),veil=document.getElementById('veil'),title=document.getElementById('dialogTitle'),content=document.getElementById('dialogContent');let open=false,hour=12;function flip(){open=!open;scene.classList.toggle('is-open',open);const text=open?'Zamknij szufladę':'Otwórz szufladę';toggle.textContent=text;drawer.setAttribute('aria-label',text);drawer.setAttribute('aria-expanded',String(open))}toggle.addEventListener('click',flip);function show(t,markup){title.textContent=t;content.innerHTML=markup;veil.hidden=false;document.getElementById('close').focus()}function close(){veil.hidden=true}document.getElementById('close').onclick=close;veil.addEventListener('click',e=>{if(e.target===veil)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!veil.hidden)close()});document.querySelectorAll('.hotspot').forEach(button=>button.addEventListener('click',()=>{const item=button.dataset.item;if(item==='drawer'){flip();return}if(item==='radio'){show('Stare radio','<p>Przesuń pokrętło, aby dostroić odbiornik.</p><div class="freq" id="freq">90.0 MHz</div><input type="range" id="tuner" min="87.5" max="108" step="0.1" value="90" aria-label="Częstotliwość radia"><p class="status">Wersja demonstracyjna. Właściwa częstotliwość zostanie dodana po ustaleniu zagadki.</p>');document.getElementById('tuner').oninput=e=>document.getElementById('freq').textContent=Number(e.target.value).toFixed(1)+' MHz'}if(item==='clock'){show('Stary zegar','<p>Przestaw wskazówki zegara.</p><div class="readout" id="time">12:00</div><div class="stepper"><button id="minus" aria-label="Godzina wcześniej">−</button><button id="plus" aria-label="Godzina później">+</button></div><p class="status">Wersja demonstracyjna. Godzina zagadki nie została jeszcze ustalona.</p>');hour=12;const paint=()=>document.getElementById('time').textContent=String(hour).padStart(2,'0')+':00';document.getElementById('minus').onclick=()=>{hour=(hour+23)%24;paint()};document.getElementById('plus').onclick=()=>{hour=(hour+1)%24;paint()}}if(item==='typewriter'){show('Maszyna do pisania','<p>Na starej maszynie Remington możesz wpisać hasło.</p><form id="passwordForm"><input class="field" id="password" placeholder="Wpisz hasło" aria-label="Hasło" autocomplete="off"><button class="action" type="submit">Sprawdź</button></form><p class="status" id="result"></p>');document.getElementById('passwordForm').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Zagadka jest w przygotowaniu.'}}}))})();
</script></body></html>
