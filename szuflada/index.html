<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;900&amp;display=swap"><meta name="theme-color" content="#11100e"><meta name="description" content="Tajna szuflada Starzika. Pamiątka po wizycie w Familock Escape Room."><title>Tajna szuflada Starzika | Familock</title><style>
:root{color-scheme:dark;--pink:#db9aa4}*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Barlow,Arial,sans-serif}.mast{height:66px;padding:10px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.logo{font:900 27px 'Barlow Condensed',sans-serif;text-decoration:none;color:#fff}.logo b{color:#d98b97}.mast small{font-size:10px;letter-spacing:.19em;color:#aaa}.intro{text-align:center;padding:24px 12px 16px}.intro small{font-size:10px;letter-spacing:.3em;color:#d7a2a9}.intro h1{font:700 clamp(32px,5vw,59px) 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:8px 0}.intro p{font-size:13px;color:#b8b0b0;margin:0}.stage{position:relative;width:min(1250px,96vw);margin:auto;aspect-ratio:2048/1151;background:#1c1210;overflow:hidden;box-shadow:0 18px 85px #000;border:1px solid #493432;isolation:isolate}.desk,.drawer-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.77) sepia(.13) contrast(1.07);user-select:none;pointer-events:none}.drawer-layer{clip-path:polygon(15% 68%,48% 68%,48% 100%,15% 100%);opacity:0;transform:translateY(-8%);transition:transform .85s cubic-bezier(.2,.7,.2,1),opacity .65s;z-index:1}.stage.open .drawer-layer{opacity:1;transform:translateY(0)}.stage:before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 52% 38%,transparent 28%,#05030480 100%);mix-blend-mode:multiply}.stage:after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}.hit{position:absolute;z-index:4;background:transparent;border:1px solid transparent;cursor:pointer;border-radius:12px;color:#fff}.hit:hover,.hit:focus-visible{background:#fff1;border-color:#f3e3db70;outline:none}.hit span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding:7px 11px;background:#100b0bdc;white-space:nowrap;opacity:0;font-size:12px}.hit:hover span,.hit:focus-visible span{opacity:1}.hit:after{content:'';position:absolute;top:50%;left:50%;width:6px;height:6px;background:#f2d9d8;border-radius:50%;box-shadow:0 0 0 5px #10070788,0 0 14px #e0a0a5;transform:translate(-50%,-50%)}.lamp{left:4%;top:2%;width:25%;height:32%}.clock{left:38%;top:19%;width:20%;height:23%}.machine{left:55%;top:18%;width:25%;height:42%}.drawer{left:18%;top:72%;width:34%;height:26%}.stage:not(.open) .drawer{left:18%;top:76%;width:62%;height:21%}.bottom{width:min(1250px,96vw);margin:auto;display:flex;justify-content:space-between;gap:10px;padding:13px 0;color:#aaa;font-size:12px}.toggle{border:0;background:none;color:#e2a1ab;text-decoration:underline;cursor:pointer}.veil{position:fixed;inset:0;z-index:10;background:#050404ed;display:grid;place-items:center;padding:20px}.veil[hidden]{display:none}.detail{position:relative;width:min(880px,100%);max-height:90vh;overflow:auto;border:1px solid #5d4446;background:#161110;padding:clamp(18px,4vw,34px);box-shadow:0 24px 80px #000}.detail h2{font:700 clamp(28px,5vw,45px) 'Barlow Condensed';margin:0 0 10px}.detail p{color:#c4b7b4;line-height:1.6}.detail img{width:100%;max-height:54vh;object-fit:contain;background:#0b0807;filter:brightness(.82) sepia(.12)}.exit{position:absolute;right:12px;top:5px;color:#fff;background:transparent;border:0;font-size:33px;cursor:pointer}.control{width:100%;margin:14px 0 0;background:#0b0909;border:1px solid #71565a;color:#eee;padding:13px;font:inherit}.action{background:#702c37;border:1px solid #a75662;color:#fff;padding:11px 19px;margin-top:12px;cursor:pointer}.status{font-size:12px;color:#d8a8b1}.clockface{font:32px Georgia,serif;text-align:center;padding:14px}.clockcontrols{display:flex;justify-content:center;gap:12px}.clockcontrols button{padding:9px 17px;background:#282020;color:#eee;border:1px solid #72585a;cursor:pointer}@media(max-width:700px){.stage{width:100%;aspect-ratio:2048/1151}.bottom{padding:12px}.mast{height:60px}.intro{padding:20px 12px}.hit:after{width:5px;height:5px}}@media(prefers-reduced-motion:reduce){.drawer-layer{transition:none}}
</style></head><body><header class="mast"><a class="logo" href="/">FAMI<b>LOCK</b></a><small>STARZIK · PAMIĄTKA PO GRZE</small></header><section class="intro"><small>JESZCZE JEDNA HISTORIA</small><h1>Tajna szuflada Starzika</h1><p>Dotknij przedmiotów. Otwórz szufladę. Zobacz, co zostało na biurku.</p></section><main><div class="stage" id="stage"><img class="desk" src="assets/biurko.webp" alt="Biurko Starzika z góry"><img class="drawer-layer" src="assets/szuflada.webp" alt="" aria-hidden="true"><button class="hit lamp" data-item="lamp" aria-label="Lampka"><span>Lampka</span></button><button class="hit clock" data-item="clock" aria-label="Zegar"><span>Zegar</span></button><button class="hit machine" data-item="machine" aria-label="Maszyna do pisania"><span>Maszyna do pisania</span></button><button class="hit drawer" id="drawer" data-item="drawer" aria-label="Otwórz szufladę" aria-expanded="false"><span>Szuflada</span></button></div><div class="bottom"><span>Wybierz przedmiot na fotografii</span><button class="toggle" id="toggle">Otwórz szufladę</button></div></main><div class="veil" id="veil" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="detail"><button class="exit" id="exit" aria-label="Zamknij">×</button><h2 id="detailTitle"></h2><div id="content"></div></div></div><script>
(()=>{const stage=document.querySelector('#stage'),drawer=document.querySelector('#drawer'),toggle=document.querySelector('#toggle'),veil=document.querySelector('#veil'),title=document.querySelector('#detailTitle'),content=document.querySelector('#content');let opened=false,hour=12,frequency=90;function flip(){opened=!opened;stage.classList.toggle('open',opened);const label=opened?'Zamknij szufladę':'Otwórz szufladę';toggle.textContent=label;drawer.setAttribute('aria-label',label);drawer.setAttribute('aria-expanded',opened)}toggle.onclick=flip;function show(t,html){title.textContent=t;content.innerHTML=html;veil.hidden=false;document.querySelector('#exit').focus()}function close(){veil.hidden=true}document.querySelector('#exit').onclick=close;veil.onclick=e=>{if(e.target===veil)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{const a=el.dataset.item;if(a==='drawer'){flip();return}if(a==='machine'){show('Maszyna do pisania','<p>Stara maszyna Remington. Wpisz hasło, aby odczytać wiadomość.</p><input class="control" id="password" aria-label="Hasło" placeholder="Wpisz hasło" autocomplete="off"><button class="action" id="submit">Sprawdź</button><p class="status" id="result"></p>');document.querySelector('#submit').onclick=()=>document.querySelector('#result').textContent='Rozwiązanie zagadki ustalimy w kolejnym etapie.'}if(a==='clock'){show('Zegar','<p>Ustaw wskazówki starego zegara.</p><div class="clockface" id="time">12:00</div><div class="clockcontrols"><button id="minus">−</button><button id="plus">+</button></div><p class="status">Mechanika demonstracyjna. Godzina zagadki nie została jeszcze ustalona.</p>');hour=12;const paint=()=>document.querySelector('#time').textContent=String(hour).padStart(2,'0')+':00';document.querySelector('#minus').onclick=()=>{hour=(hour+23)%24;paint()};document.querySelector('#plus').onclick=()=>{hour=(hour+1)%24;paint()}}if(a==='lamp'){show('Lampka','<p>Stara lampka oświetla biurko. W kolejnej wersji odsłoni ukrytą wskazówkę.</p>')}})})();
</script></body></html>
