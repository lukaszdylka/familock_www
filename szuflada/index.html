:root{color-scheme:dark;--rose:#d39ba4}*{box-sizing:border-box}body{margin:0;background:#0a0808;color:#eee;font-family:Barlow,Arial,sans-serif}.mast{display:flex;align-items:center;justify-content:space-between;padding:15px clamp(16px,5vw,65px);border-bottom:1px solid #ffffff20}.brand{color:#f5e6dc;text-decoration:none;font:800 27px 'Barlow Condensed',sans-serif}.brand em{font-style:normal;color:var(--rose)}.mast small{letter-spacing:.18em;font-size:10px;color:#bba8a0}.intro{text-align:center;padding:12px 15px 12px}.intro small{letter-spacing:.25em;color:var(--rose);font-size:10px}.intro h1{font:800 clamp(32px,5vw,58px) 'Barlow Condensed',sans-serif;margin:5px 0 8px;text-transform:uppercase}.intro p{margin:0;color:#b9a7a0;font-size:13px}.scene-wrap{width:min(1540px,98vw);margin:auto;overflow-x:auto;scrollbar-color:#6d4747 #160f0f}.scene{position:relative;width:100%;min-width:0;aspect-ratio:1672/381;isolation:isolate;overflow:hidden;background:#170e0b;box-shadow:0 20px 80px #000}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.photo.open-state{opacity:0;transition:opacity .7s ease}.scene.is-open .photo.open-state{opacity:1}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#07030370,transparent 14%,transparent 86%,#07030370);z-index:3}.closed-front{position:absolute;left:34.6%;top:57%;width:30.9%;height:43%;z-index:2;transform:translateY(0);transform-origin:top center;transition:transform .7s ease,opacity .55s ease;background:repeating-linear-gradient(1deg,#472211 0px,#542c17 4px,#2d140c 9px,#62371d 13px,#3c2011 20px);border:8px solid #281309;border-top:13px solid #170b08;box-shadow:inset 0 0 25px #130704,0 4px 17px #000c}.closed-front:before{content:'';position:absolute;left:45%;top:55%;width:10%;height:12%;border:3px solid #b38a4d;border-radius:0 0 55% 55%;box-shadow:0 1px 3px #000;background:#342010}.closed-front:after{content:'';position:absolute;left:49%;top:37%;width:2%;height:11%;border:2px solid #8e6838;border-radius:50%;background:#1b0b05}.scene.is-open .closed-front{transform:translateY(100%);opacity:0}.hit{position:absolute;z-index:5;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:#fff}.hit:hover{background:transparent;border-color:transparent}.hit:focus-visible{outline:2px solid #e5b4aa;outline-offset:2px}.hit span{display:none}.radio{left:18.5%;top:14%;width:19%;height:36%}.clock{left:42.2%;top:16%;width:16.5%;height:28%}.machine{left:63%;top:13%;width:19.5%;height:40%}.drawer{left:35%;top:70%;width:30%;height:24%}.veil{position:fixed;inset:0;z-index:20;background:#050404ee;display:grid;place-items:center;padding:16px}.veil[hidden]{display:none}.panel{position:relative;width:min(640px,100%);max-height:90vh;overflow:auto;padding:clamp(20px,5vw,40px);background:#17110f;border:1px solid #644549;box-shadow:0 20px 70px #000}.panel h2{font:800 40px 'Barlow Condensed',sans-serif;margin:0 0 10px}.panel p{color:#d0bdb4;line-height:1.6}.exit{position:absolute;top:7px;right:13px;background:none;border:0;color:#eee;font-size:32px;cursor:pointer}.field{width:100%;padding:12px;background:#090807;border:1px solid #725659;color:#fff;font:inherit}.action{margin-top:12px;padding:10px 18px;background:#6b3440;border:1px solid #ac7780;color:#fff;cursor:pointer}.readout{text-align:center;font:34px Georgia,serif;padding:12px;color:#e9d0b3}.stepper{display:flex;justify-content:center;gap:14px}.stepper button{background:#30221f;border:1px solid #755653;color:#fff;padding:9px 20px;cursor:pointer}.status{font-size:12px;color:#d9a8b0}input[type=range]{width:100%;accent-color:var(--rose)}@media(max-width:800px){.scene-wrap{scroll-snap-type:x proximity}.scene{scroll-snap-align:start;min-width:780px}.intro{padding:18px 12px}.mast small{font-size:8px}}@media(prefers-reduced-motion:reduce){.photo.open-state{transition:none}}
.radio-console{padding:18px 8px 10px;text-align:center;background:radial-gradient(ellipse at center,#36241a,#17100d 72%);border:1px solid #65452c;box-shadow:inset 0 0 30px #070404}.radio-scale{display:flex;justify-content:space-between;color:#bd9a6f;font:12px Georgia,serif;letter-spacing:.08em;margin:0 auto 12px;max-width:310px}.radio-dial{position:relative;display:block;margin:8px auto 15px;width:min(230px,65vw);height:min(230px,65vw);border:0;border-radius:50%;background:repeating-conic-gradient(from -135deg,#a78551 0deg 1deg,transparent 1deg 12deg),radial-gradient(circle,#35291f 57%,#100b09 59%,#6e4d2e 63%,#1c130e 68%,transparent 70%);cursor:grab;touch-action:none;user-select:none}.radio-dial:active{cursor:grabbing}.radio-dial:focus-visible{outline:2px solid #e7b78e;outline-offset:5px}.radio-knob{position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle at 35% 27%,#866644,#392718 42%,#170e0a 78%);border:5px solid #654628;box-shadow:inset 0 0 13px #080503,0 7px 14px #000a;transform:rotate(var(--dial-angle,-120deg));pointer-events:none}.radio-knob:before{content:"";position:absolute;left:calc(50% - 3px);top:10%;width:6px;height:25%;border-radius:4px;background:#e5bf80;box-shadow:0 0 6px #ffd49a}.radio-display{display:inline-block;min-width:190px;padding:10px 20px;background:#c4a36b;color:#21180e;border:5px ridge #65492d;box-shadow:inset 0 0 15px #725631;font:30px Georgia,serif;font-variant-numeric:tabular-nums}.radio-band{font:12px Georgia,serif;color:#c9ab81;letter-spacing:.24em;margin:8px 0}.radio-hint{font-size:12px;color:#a99480;margin:10px 0 0}.clock-shell{display:grid;place-items:center;padding:15px 0 5px;background:radial-gradient(ellipse at center,#39271b,#17110e 72%);border:1px solid #654a35}.clock-face{display:block;width:min(330px,76vw);height:auto;overflow:visible;touch-action:none;cursor:grab;user-select:none}.clock-face:active{cursor:grabbing}.clock-face:focus-visible{outline:2px solid #d4a67e;outline-offset:5px}.clock-minute{stroke:#2a2018;stroke-width:3.5;stroke-linecap:round}.clock-hour{stroke:#2a2018;stroke-width:5.5;stroke-linecap:round}.clock-hand{transform-origin:150px 150px;pointer-events:none}.clock-time{font:27px Georgia,serif;color:#e5c5a1;margin:6px 0 10px;font-variant-numeric:tabular-nums}.clock-face .clock-mark{stroke:#674d34;stroke-linecap:round}.clock-face .clock-number{font:22px Georgia,serif;fill:#3d2b1d;text-anchor:middle;dominant-baseline:central}</style></head><body><header class="mast"><a class="brand" href="/">FAMI<em>LOCK</em></a><small>STARZIK · PAMIĄTKA PO GRZE</small></header><section class="intro"><small>JESZCZE JEDNA HISTORIA</small><h1>Tajna szuflada Starzika</h1><p>Nie wszystko, co zostało po Starziku, powinno ujrzeć światło dzienne.</p></section><main><div class="scene-wrap" aria-label="Interaktywne biurko Starzika"><div class="scene" id="scene"><img class="photo" src="assets/starzik-closed-v2.webp" alt="Biurko Starzika z zamkniętą szufladą"><img class="photo open-state" src="assets/starzik-open-v2.webp" alt="" aria-hidden="true"><button class="hit radio" data-item="radio" aria-label="Radio"><span>Radio</span></button><button class="hit clock" data-item="clock" aria-label="Zegar"><span>Zegar</span></button><button class="hit machine" data-item="machine" aria-label="Maszyna do pisania"><span>Maszyna do pisania</span></button><button class="hit drawer" id="drawer" data-item="drawer" aria-label="Otwórz szufladę" aria-expanded="false"><span>Szuflada</span></button></div></div></main><div class="veil" id="veil" hidden role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel"><button class="exit" id="exit" aria-label="Zamknij">×</button><h2 id="title"></h2><div id="content"></div></div></div><script>
(()=>{const scene=document.getElementById('scene'),drawer=document.getElementById('drawer'),veil=document.getElementById('veil'),title=document.getElementById('title'),content=document.getElementById('content');let opened=false,hour=12;function flip(){opened=!opened;scene.classList.toggle('is-open',opened);const label=opened?'Zamknij szufladę':'Otwórz szufladę';drawer.setAttribute('aria-label',label);drawer.setAttribute('aria-expanded',String(opened))}function show(t,html){title.textContent=t;content.innerHTML=html;veil.hidden=false;document.getElementById('exit').focus()}function close(){veil.hidden=true}document.getElementById('exit').onclick=close;veil.onclick=e=>{if(e.target===veil)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{const a=el.dataset.item||el.dataset.open;if(a==='drawer'){flip();return}if(a==='machine'){show('Maszyna do pisania','<p>Stara maszyna Remington. Wpisz hasło, aby odczytać wiadomość.</p><form id="form"><input class="field" id="password" aria-label="Hasło" placeholder="Wpisz hasło" autocomplete="off"><button class="action">Sprawdź</button></form><p class="status" id="result"></p>');document.getElementById('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Zagadka jest jeszcze w przygotowaniu.'}}if(a==='clock'){const ticks=Array.from({length:60},(_,i)=>{const ang=i*Math.PI/30,major=i%5===0,r1=major?113:119,r2=128;return '<line class="clock-mark" x1="'+(150+Math.sin(ang)*r1)+'" y1="'+(150-Math.cos(ang)*r1)+'" x2="'+(150+Math.sin(ang)*r2)+'" y2="'+(150-Math.cos(ang)*r2)+'" stroke-width="'+(major?3:1)+'"/>'}).join('');const nums=Array.from({length:12},(_,i)=>{const n=i+1,ang=n*Math.PI/6;return '<text class="clock-number" x="'+(150+Math.sin(ang)*91)+'" y="'+(150-Math.cos(ang)*91)+'">'+n+'</text>'}).join('');show('Zegar','<div class="clock-shell"><svg id="clockFace" class="clock-face" viewBox="0 0 300 300" role="slider" tabindex="0" aria-label="Ustawienie wskazówek zegara" aria-valuemin="0" aria-valuemax="1435" aria-valuenow="600" aria-valuetext="10:00"><defs><radialGradient id="clockPaper"><stop stop-color="#ead4ac"/><stop offset=".85" stop-color="#c7a77a"/><stop offset="1" stop-color="#a88154"/></radialGradient></defs><circle cx="150" cy="150" r="148" fill="#21160f" stroke="#80603c" stroke-width="4"/><circle cx="150" cy="150" r="137" fill="url(#clockPaper)" stroke="#4c3421" stroke-width="8"/>'+ticks+nums+'<g id="hourHand" class="clock-hand"><line class="clock-hour" x1="150" y1="163" x2="150" y2="91"/></g><g id="minuteHand" class="clock-hand"><line class="clock-minute" x1="150" y1="169" x2="150" y2="51"/></g><circle cx="150" cy="150" r="7" fill="#6a4c2d" stroke="#241810" stroke-width="2"/></svg><output id="clockTime" class="clock-time">10:00</output></div>');const face=document.getElementById('clockFace'),h=document.getElementById('hourHand'),m=document.getElementById('minuteHand'),out=document.getElementById('clockTime');let minutes=600,active=false,lastAngle=0,pendingAngle=0;const paint=()=>{minutes=(minutes+1440)%1440;h.setAttribute('transform','rotate('+(minutes/2)+',150,150)');m.setAttribute('transform','rotate('+(minutes*6)+',150,150)');const time=String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');out.textContent=time;face.setAttribute('aria-valuenow',String(minutes));face.setAttribute('aria-valuetext',time)};const angle=e=>{const p=face.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const matrix=face.getScreenCTM();if(!matrix)return 0;const q=p.matrixTransform(matrix.inverse());return Math.atan2(q.x-150,150-q.y)*180/Math.PI};face.addEventListener('pointerdown',e=>{active=true;lastAngle=angle(e);pendingAngle=0;face.setPointerCapture(e.pointerId)});face.addEventListener('pointermove',e=>{if(!active)return;const now=angle(e);let delta=now-lastAngle;if(delta>180)delta-=360;if(delta< -180)delta+=360;lastAngle=now;pendingAngle+=delta;const step=Math.trunc(pendingAngle/30);if(step){minutes+=step*5;pendingAngle-=step*30;paint()}});const stop=()=>active=false;face.addEventListener('pointerup',stop);face.addEventListener('pointercancel',stop);face.addEventListener('lostpointercapture',stop);face.addEventListener('keydown',e=>{const steps={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5,PageUp:60,PageDown:-60};if(e.key in steps){e.preventDefault();minutes+=steps[e.key];paint()}else if(e.key==='Home'){e.preventDefault();minutes=0;paint()}else if(e.key==='End'){e.preventDefault();minutes=1435;paint()}});paint()}if(a==='radio'){show('Radio','<div class="radio-console"><div class="radio-band">UKF · FM</div><div class="radio-scale"><span>87,5</span><span>98</span><span>108</span></div><button type="button" class="radio-dial" id="radioDial" role="slider" aria-label="Częstotliwość radia" aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="90" aria-valuetext="90,0 megaherca" tabindex="0"><span class="radio-knob"></span></button><output class="radio-display" id="freq">90,0 MHz</output><p class="radio-hint">FM 87,5–108 MHz</p></div>');const dial=document.getElementById('radioDial'),out=document.getElementById('freq');let value=90,drag=false,lastAngle=0;const centerAngle=e=>{const b=dial.getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI};const paint=()=>{value=Math.max(87.5,Math.min(108,Math.round(value*10)/10));out.textContent=value.toFixed(1).replace('.',',')+' MHz';dial.style.setProperty('--dial-angle',(-120+(value-87.5)/20.5*240)+'deg');dial.setAttribute('aria-valuenow',String(value));dial.setAttribute('aria-valuetext',value.toFixed(1).replace('.',',')+' megaherca')};paint();dial.addEventListener('pointerdown',e=>{drag=true;lastAngle=centerAngle(e);dial.setPointerCapture(e.pointerId)});dial.addEventListener('pointermove',e=>{if(!drag)return;const angle=centerAngle(e);let delta=angle-lastAngle;if(delta>180)delta-=360;if(delta< -180)delta+=360;value+=delta*20.5/240;lastAngle=angle;paint()});const stop=()=>{drag=false};dial.addEventListener('pointerup',stop);dial.addEventListener('pointercancel',stop);dial.addEventListener('lostpointercapture',stop);dial.addEventListener('keydown',e=>{const steps={ArrowLeft:-.1,ArrowDown:-.1,ArrowRight:.1,ArrowUp:.1,PageDown:-1,PageUp:1};if(e.key in steps){e.preventDefault();value+=steps[e.key];paint()}else if(e.key==='Home'){e.preventDefault();value=87.5;paint()}else if(e.key==='End'){e.preventDefault();value=108;paint()}})}})})();
</script></body></html>
